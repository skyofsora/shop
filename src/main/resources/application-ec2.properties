server.port=${SERVER_PORT:8080}

spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://${SHOP_DB_HOST:localhost}:${SHOP_DB_PORT:3306}/${SHOP_DB_NAME:shop_local}
spring.datasource.username=${SHOP_DB_USERNAME:shop_app}
spring.datasource.password=${SHOP_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

shop.upload-root=${SHOP_UPLOAD_ROOT:/home/ec2-user/shop/uploads}
itemImgLocation=${shop.upload-root}/item
uploadPath=file:${shop.upload-root}/

spring.mail.username=${SHOP_MAIL_USERNAME}
spring.mail.password=${SHOP_MAIL_PASSWORD}

spring.security.oauth2.client.registration.google.client-id=${SHOP_GOOGLE_CLIENT_ID:ec2-disabled}
spring.security.oauth2.client.registration.google.client-secret=${SHOP_GOOGLE_CLIENT_SECRET:ec2-disabled}
spring.security.oauth2.client.registration.naver.client-id=${SHOP_NAVER_CLIENT_ID:ec2-disabled}
spring.security.oauth2.client.registration.naver.client-secret=${SHOP_NAVER_CLIENT_SECRET:ec2-disabled}
spring.security.oauth2.client.registration.kakao.client-id=${SHOP_KAKAO_CLIENT_ID:ec2-disabled}
spring.security.oauth2.client.registration.kakao.client-secret=${SHOP_KAKAO_CLIENT_SECRET:ec2-disabled}
logging.level.org.hibernate.orm.jdbc.bind=info

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never