# Local HTTP server
server.port=8080

# Local MariaDB baseline
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://localhost:3306/shop_local
spring.datasource.username=shop_app
spring.datasource.password=${SHOP_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# Keep uploaded files inside an ignored local workspace directory.
shop.upload-root=${SHOP_UPLOAD_ROOT:${user.dir}/.local/uploads}
itemImgLocation=${shop.upload-root}/item
uploadPath=file:${shop.upload-root}/

# Allow the local baseline to start without real OAuth credentials.
# Social login remains unavailable until these environment variables are set.
spring.security.oauth2.client.registration.google.client-id=${SHOP_GOOGLE_CLIENT_ID:local-disabled}
spring.security.oauth2.client.registration.google.client-secret=${SHOP_GOOGLE_CLIENT_SECRET:local-disabled}
spring.security.oauth2.client.registration.naver.client-id=${SHOP_NAVER_CLIENT_ID:local-disabled}
spring.security.oauth2.client.registration.naver.client-secret=${SHOP_NAVER_CLIENT_SECRET:local-disabled}
spring.security.oauth2.client.registration.kakao.client-id=${SHOP_KAKAO_CLIENT_ID:local-disabled}
spring.security.oauth2.client.registration.kakao.client-secret=${SHOP_KAKAO_CLIENT_SECRET:local-disabled}

# Avoid logging bound SQL parameter values in the local baseline.
logging.level.org.hibernate.orm.jdbc.bind=info
